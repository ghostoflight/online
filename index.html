<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0D1117">
<title>ONLINE — Sign In</title>

<!-- ══════════════════════════════════════════
     FONTS: Inter (UI) + JetBrains Mono (data)
══════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ══════════════════════════════════════════
   DESIGN TOKENS
   مزيج من الأزرق الليلي العميق + الأخضر الكهربائي
   كهوية بصرية لمنصة مراقبة/تحكم احترافية
══════════════════════════════════════════ */
:root {
  /* خلفيات */
  --bg-deep:    #080C12;   /* الخلفية الأعمق */
  --bg-dark:    #0D1117;   /* الخلفية الرئيسية */
  --bg-card:    #111820;   /* بطاقة تسجيل الدخول */
  --bg-input:   #161D27;   /* حقول الإدخال */
  --bg-hover:   #1A2333;   /* hover على العناصر */

  /* حدود */
  --border:     #1E2A3A;   /* الحد الأساسي */
  --border-md:  #243040;   /* حد متوسط */
  --border-focus: #10B981; /* حد التركيز (أخضر) */

  /* نصوص */
  --text-primary:   #E8F0FE;  /* نص رئيسي */
  --text-secondary: #6B7FA3;  /* نص ثانوي */
  --text-muted:     #3D4F6B;  /* نص خافت */
  --text-label:     #8A9BB8;  /* تسميات الحقول */

  /* ألوان التمييز */
  --green:      #10B981;   /* الأخضر الرئيسي */
  --green-glow: rgba(16,185,129,0.15);
  --green-dk:   #059669;
  --green-lt:   rgba(16,185,129,0.08);

  --red:        #EF4444;
  --red-glow:   rgba(239,68,68,0.15);
  --amber:      #F59E0B;
  --amber-glow: rgba(245,158,11,0.15);
  --blue:       #3B82F6;
  --blue-glow:  rgba(59,130,246,0.12);

  /* تأثيرات */
  --shadow-card: 0 0 0 1px var(--border), 0 24px 64px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.3);
  --shadow-btn:  0 4px 24px rgba(16,185,129,0.3), 0 0 0 1px rgba(16,185,129,0.2);
  --shadow-input-focus: 0 0 0 3px rgba(16,185,129,0.12), inset 0 1px 0 rgba(255,255,255,0.03);

  /* نصف القطر */
  --radius-sm:  6px;
  --radius:     10px;
  --radius-lg:  14px;
  --radius-xl:  20px;

  /* انتقالات */
  --ease: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ══════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* منع التحديد العرضي للنصوص في واجهة الدخول */
  -webkit-user-select: none;
  user-select: none;
}

/* السماح بالتحديد فقط في حقول الإدخال */
input, textarea, [contenteditable] {
  -webkit-user-select: text;
  user-select: text;
}

/* ══════════════════════════════════════════
   ANIMATED BACKGROUND — الشبكة المتحركة
   العنصر المميز: شبكة نقاط تنبض ببطء
   تعكس طابع "مراقبة الشبكة / الاتصال"
══════════════════════════════════════════ */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

/* شبكة النقاط باستخدام SVG pattern */
.bg-canvas::before {
  content: '';
  position: absolute;
  inset: -10%;
  background-image:
    radial-gradient(circle, rgba(16,185,129,0.12) 1px, transparent 1px);
  background-size: 36px 36px;
  animation: gridDrift 20s ease-in-out infinite alternate;
}

/* تدرجات الضوء المحيطة */
.bg-canvas::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 85%, rgba(16,185,129,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 15%, rgba(59,130,246,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(8,12,18,0.7) 0%, transparent 80%);
}

@keyframes gridDrift {
  0%   { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(8px, 12px) rotate(0.5deg); }
}

/* ══════════════════════════════════════════
   LOGIN WRAPPER
══════════════════════════════════════════ */
#login-screen {
  position: relative;
  z-index: 10;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

/* ══════════════════════════════════════════
   LOGIN CARD
══════════════════════════════════════════ */
.login-card {
  width: 100%;
  max-width: 400px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 40px 36px 36px;
  box-shadow: var(--shadow-card);
  animation: cardEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  position: relative;
  overflow: hidden;
}

/* خط إضاءة علوي رفيع على البطاقة */
.login-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(16,185,129,0.4) 30%,
    rgba(16,185,129,0.6) 50%,
    rgba(16,185,129,0.4) 70%,
    transparent 100%
  );
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}

/* ══════════════════════════════════════════
   BRAND HEADER
══════════════════════════════════════════ */
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 36px;
}

.brand-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(16,185,129,0.35), 0 0 0 1px rgba(16,185,129,0.3);
  flex-shrink: 0;
  /* نبضة خفيفة تدل على "الاتصال الحي" */
  animation: iconPulse 3s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(16,185,129,0.35), 0 0 0 1px rgba(16,185,129,0.3); }
  50%       { box-shadow: 0 4px 28px rgba(16,185,129,0.5), 0 0 0 1px rgba(16,185,129,0.45), 0 0 20px rgba(16,185,129,0.15); }
}

.brand-icon svg {
  color: white;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-name {
  font-size: 22px;
  font-weight: 900;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  line-height: 1;
}

.brand-name span {
  color: var(--green);
}

.brand-tagline {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: 'JetBrains Mono', monospace;
}

/* ══════════════════════════════════════════
   HEADINGS
══════════════════════════════════════════ */
.login-heading {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.2px;
}

.login-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 28px;
  line-height: 1.5;
}

/* ══════════════════════════════════════════
   FORM FIELDS
══════════════════════════════════════════ */
.field-group {
  margin-bottom: 16px;
}

.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}

.field-label span {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-label);
  letter-spacing: 0.02em;
}

/* غلاف الحقل مع الأيقونة */
.field-wrap {
  position: relative;
}

.field-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  width: 16px;
  height: 16px;
  pointer-events: none;
  transition: color var(--ease);
}

.field-input {
  width: 100%;
  background: var(--bg-input);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px 12px 42px;
  color: var(--text-primary);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
  /* أمان: منع الحفظ التلقائي للبيانات الحساسة */
  autocomplete: off;
}

.field-input::placeholder {
  color: var(--text-muted);
  font-size: 13px;
}

/* تأثير التركيز */
.field-input:focus {
  border-color: var(--border-focus);
  box-shadow: var(--shadow-input-focus);
  background: var(--bg-hover);
}

/* تغيير لون الأيقونة عند التركيز */
.field-wrap:focus-within .field-icon {
  color: var(--green);
}

/* زر إظهار/إخفاء كلمة المرور */
.field-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  padding: 4px;
  border-radius: 4px;
  transition: color var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
}

.field-toggle:hover {
  color: var(--text-secondary);
}

/* تعديل padding حقل كلمة المرور لاستيعاب الزر */
#inp-pass {
  padding-right: 42px;
}

/* ══════════════════════════════════════════
   ERROR MESSAGE
══════════════════════════════════════════ */
.error-msg {
  min-height: 20px;
  margin-bottom: 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--red);
  display: flex;
  align-items: center;
  gap: 6px;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.error-msg.visible {
  opacity: 1;
  transform: none;
}

/* ══════════════════════════════════════════
   LOGIN BUTTON
══════════════════════════════════════════ */
.login-btn {
  width: 100%;
  background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  border: none;
  border-radius: var(--radius);
  padding: 14px 20px;
  color: white;
  font-size: 14px;
  font-weight: 700;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: all var(--ease);
  letter-spacing: 0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  overflow: hidden;
}

/* تأثير الموجة عند الضغط */
.login-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.15s ease;
}

.login-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 32px rgba(16,185,129,0.4), 0 0 0 1px rgba(16,185,129,0.25);
}

.login-btn:active:not(:disabled) {
  transform: scale(0.98);
  box-shadow: var(--shadow-btn);
}

.login-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* Spinner داخل الزر */
.btn-spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.65s linear infinite;
  display: none;
}

.login-btn.loading .btn-spinner { display: block; }
.login-btn.loading .btn-arrow    { display: none; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ══════════════════════════════════════════
   SERVER STATUS INDICATOR
   
   المنطق:
   ● أخضر ونابض  = متصل
   ● برتقالي     = جاري الفحص
   ● أحمر        = انقطع الاتصال
   ● رمادي       = لم يُفحص بعد
══════════════════════════════════════════ */
.status-bar {
  margin-top: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text-secondary);
  transition: border-color var(--ease);
}

/* حالة الاتصال — النقطة المؤشرة */
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  flex-shrink: 0;
  transition: background 0.4s ease, box-shadow 0.4s ease;
  position: relative;
}

/* النبضة عند الاتصال الناجح */
.status-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 0.4s ease;
}

/* حالة: متصل */
.status-dot.connected {
  background: var(--green);
  box-shadow: 0 0 8px rgba(16,185,129,0.6);
  animation: dotPulse 2.5s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(16,185,129,0.6); }
  50%       { box-shadow: 0 0 14px rgba(16,185,129,0.9), 0 0 4px rgba(16,185,129,0.4); }
}

/* حالة: جاري الفحص */
.status-dot.checking {
  background: var(--amber);
  box-shadow: 0 0 8px rgba(245,158,11,0.4);
  animation: dotBlink 1s ease-in-out infinite;
}

@keyframes dotBlink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

/* حالة: انقطاع */
.status-dot.disconnected {
  background: var(--red);
  box-shadow: 0 0 8px rgba(239,68,68,0.4);
  animation: none;
}

/* ══════════════════════════════════════════
   STATUS INFO — النصوص
══════════════════════════════════════════ */
.status-info {
  flex: 1;
  min-width: 0;
}

.status-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: color 0.3s ease;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.status-text.connected    { color: var(--green); }
.status-text.disconnected { color: var(--red); }
.status-text.checking     { color: var(--amber); }

/* زر إعادة المحاولة */
.status-retry {
  background: none;
  border: 1px solid var(--border-md);
  border-radius: var(--radius-sm);
  padding: 4px 9px;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--ease);
  font-family: 'Inter', sans-serif;
  display: none; /* يظهر فقط عند الانقطاع */
  white-space: nowrap;
  flex-shrink: 0;
}

.status-retry:hover {
  border-color: var(--green);
  color: var(--green);
  background: var(--green-lt);
}

/* ══════════════════════════════════════════
   FOOTER
══════════════════════════════════════════ */
.login-footer {
  margin-top: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.footer-dot {
  width: 3px;
  height: 3px;
  background: var(--text-muted);
  border-radius: 50%;
}

.footer-text {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.04em;
}

/* ══════════════════════════════════════════
   RESPONSIVE — موبايل
══════════════════════════════════════════ */
@media (max-width: 480px) {
  .login-card {
    padding: 32px 24px 28px;
    border-radius: var(--radius-lg);
  }

  .login-heading { font-size: 16px; }
  .brand-name    { font-size: 20px; }
}

/* ══════════════════════════════════════════
   ACCESSIBILITY — تقليل الحركة
══════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ══════════════════════════════════════════
   INPUT AUTO-FILL OVERRIDE
   منع تغيير الألوان عند الملء التلقائي
══════════════════════════════════════════ */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-primary);
  -webkit-box-shadow: 0 0 0 1000px var(--bg-input) inset;
  transition: background-color 5000s ease-in-out 0s;
}
</style>
</head>
<body>

<!-- خلفية الشبكة المتحركة -->
<div class="bg-canvas" aria-hidden="true"></div>

<!-- ══════════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════════ -->
<div id="login-screen" role="main">
  <div class="login-card" role="region" aria-label="Sign in form">

    <!-- شعار العلامة التجارية -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">ON<span>LINE</span></div>
        <div class="brand-tagline">Dashboard v2.0</div>
      </div>
    </div>

    <!-- العنوان -->
    <h1 class="login-heading">Welcome back</h1>
    <p class="login-sub">Sign in to access your dashboard</p>

    <!-- حقل اسم المستخدم -->
    <div class="field-group">
      <div class="field-label">
        <span>Username</span>
      </div>
      <div class="field-wrap">
        <!-- أيقونة المستخدم -->
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input
          class="field-input"
          id="inp-user"
          type="text"
          autocomplete="username"
          placeholder="your username"
          spellcheck="false"
          autocorrect="off"
          autocapitalize="off"
          aria-label="Username"
          aria-required="true"
          aria-describedby="login-error"
        >
      </div>
    </div>

    <!-- حقل كلمة المرور -->
    <div class="field-group">
      <div class="field-label">
        <span>Password</span>
      </div>
      <div class="field-wrap">
        <!-- أيقونة القفل -->
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input
          class="field-input"
          id="inp-pass"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••••"
          aria-label="Password"
          aria-required="true"
          aria-describedby="login-error"
        >
        <!-- زر إظهار/إخفاء كلمة المرور -->
        <button
          class="field-toggle"
          id="toggle-pass"
          type="button"
          onclick="togglePassword()"
          aria-label="Toggle password visibility"
          title="Show / Hide password"
        >
          <!-- أيقونة العين (إخفاء) -->
          <svg id="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- أيقونة العين المشطوبة (إظهار) -->
          <svg id="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- رسالة الخطأ — مخفية افتراضياً، تظهر عند الحاجة -->
    <div
      class="error-msg"
      id="login-error"
      role="alert"
      aria-live="polite"
      aria-atomic="true"
    >
      <!-- تُحقن برمجياً عبر setError() -->
    </div>

    <!-- زر تسجيل الدخول -->
    <button
      class="login-btn"
      id="login-btn"
      type="button"
      onclick="doLogin()"
      aria-label="Sign in"
    >
      <div class="btn-spinner" aria-hidden="true"></div>
      <span class="btn-arrow">Sign in</span>
      <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>

    <!-- ══════════════════════════════════════
         SERVER STATUS INDICATOR
         يُحدَّث تلقائياً كل 15 ثانية
         مع فحص فوري عند تحميل الصفحة
    ══════════════════════════════════════ -->
    <div class="status-bar" id="status-bar" aria-label="Server connection status" aria-live="polite">
      <!-- النقطة المؤشرة -->
      <div class="status-dot" id="status-dot" aria-hidden="true"></div>

      <!-- نص الحالة -->
      <div class="status-info">
        <div class="status-text" id="status-text">Connecting to server…</div>
      </div>

      <!-- زر إعادة المحاولة — يظهر فقط عند الانقطاع -->
      <button
        class="status-retry"
        id="status-retry"
        type="button"
        onclick="checkServerStatus()"
        aria-label="Retry connection"
      >
        Retry
      </button>
    </div>

    <!-- Footer -->
    <div class="login-footer" aria-hidden="true">
      <div class="footer-dot"></div>
      <span class="footer-text">ONLINE v2.0</span>
      <div class="footer-dot"></div>
    </div>

  </div><!-- /.login-card -->
</div><!-- /#login-screen -->


<script>
/* ════════════════════════════════════════════════════════════
   ONLINE Dashboard — Login Page Script
   
   المهام:
   1. doLogin()          — معالجة تسجيل الدخول بأمان
   2. checkServerStatus()— فحص الاتصال بالسيرفر
   3. startStatusPolling()— فحص دوري كل 15 ثانية
   4. togglePassword()   — إظهار/إخفاء كلمة المرور
   5. setError()         — عرض رسائل الخطأ بأمان
════════════════════════════════════════════════════════════ */

/* ════ CONFIGURATION ════ */
const DEFAULT_SERVER = 'https://onlineworki-production.up.railway.app';

/* استرجاع عنوان السيرفر المحفوظ أو استخدام الافتراضي */
let API = localStorage.getItem('ol_srv') || DEFAULT_SERVER;
let TOKEN = localStorage.getItem('ol_tok') || '';

/* ═══ متغيرات حالة الاتصال ═══ */
let _statusTimer = null;       /* مؤقت الفحص الدوري */
let _statusAbort = null;       /* AbortController لإلغاء الطلب عند الحاجة */
const STATUS_INTERVAL = 15000; /* فحص كل 15 ثانية */
const STATUS_TIMEOUT  = 6000;  /* مهلة الطلب 6 ثوانٍ */

/* ════════════════════════════════════════════════════════════
   BOOT — يُشغَّل عند تحميل الصفحة
════════════════════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', () => {
  /* 1. إذا كان هناك token محفوظ، حاول استعادة الجلسة */
  if (TOKEN) {
    restoreSession();
  }

  /* 2. ربط Enter بالحقول للتنقل الذكي */
  document.getElementById('inp-user').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('inp-pass').focus();
  });

  document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  /* 3. مسح رسالة الخطأ عند الكتابة */
  document.getElementById('inp-user').addEventListener('input', clearError);
  document.getElementById('inp-pass').addEventListener('input', clearError);

  /* 4. فحص فوري لحالة السيرفر + بدء الفحص الدوري */
  checkServerStatus();
  startStatusPolling();
});

/* ════════════════════════════════════════════════════════════
   SESSION RESTORE
   يحاول استعادة جلسة موجودة دون المرور بالـ login مرة أخرى
════════════════════════════════════════════════════════════ */
async function restoreSession() {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 8000);

    const res = await fetch(API + '/auth/me', {
      method: 'GET',
      headers: {
        'Content-Type': 'application/json',
        'X-Token': TOKEN
      },
      signal: controller.signal
    });

    clearTimeout(timer);

    if (res.ok) {
      /* الجلسة صالحة — انتقل للتطبيق */
      const userData = await res.json();
      enterApp(userData);
    } else {
      /* الجلسة منتهية — امسح الـ token */
      localStorage.removeItem('ol_tok');
      TOKEN = '';
    }
  } catch {
    /* شبكة منقطعة أو timeout — ابقَ في صفحة الدخول */
    localStorage.removeItem('ol_tok');
    TOKEN = '';
  }
}

/* ════════════════════════════════════════════════════════════
   DO LOGIN
   
   الأمان المطبَّق:
   ✓ تعقيم المدخلات (trim فقط — الـ backend يتولى التحقق الكامل)
   ✓ تعطيل الزر أثناء الطلب لمنع الإرسال المتكرر
   ✓ رسائل خطأ مبهمة (لا تكشف تفاصيل البنية)
   ✓ محدودية طول اسم المستخدم وكلمة المرور
════════════════════════════════════════════════════════════ */
async function doLogin() {
  const username = document.getElementById('inp-user').value.trim();
  const password = document.getElementById('inp-pass').value;
  const btn      = document.getElementById('login-btn');

  /* ═ تحقق من الحقول الفارغة ═ */
  if (!username) {
    setError('Enter your username to continue.');
    document.getElementById('inp-user').focus();
    return;
  }

  if (!password) {
    setError('Enter your password to continue.');
    document.getElementById('inp-pass').focus();
    return;
  }

  /* ═ حد أقصى للطول (حماية ضد payloads ضخمة) ═ */
  if (username.length > 64) {
    setError('Username is too long.');
    return;
  }

  if (password.length > 128) {
    setError('Password is too long.');
    return;
  }

  /* ═ تفعيل حالة التحميل ═ */
  setLoading(btn, true);
  clearError();

  try {
    const controller = new AbortController();
    const reqTimer   = setTimeout(() => controller.abort(), 12000);

    const res = await fetch(API + '/auth/login', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      signal: controller.signal
    });

    clearTimeout(reqTimer);

    const data = await res.json();

    if (res.ok && data.token) {
      /* ═ نجح الدخول ═ */
      TOKEN = data.token;
      localStorage.setItem('ol_tok', TOKEN);

      /* حفظ عنوان السيرفر إن تغيّر */
      localStorage.setItem('ol_srv', API);

      enterApp(data);
    } else {
      /*
       * رسالة خطأ مقصودة الغموض:
       * لا نكشف إذا كان المستخدم غير موجود أو كلمة المرور خاطئة
       * لمنع هجمات Username Enumeration
       */
      const reason = data?.error || '';
      if (reason.toLowerCase().includes('disabled') || reason.toLowerCase().includes('inactive')) {
        setError('This account has been disabled. Contact your administrator.');
      } else if (res.status === 429) {
        setError('Too many attempts. Please wait a moment before trying again.');
      } else if (res.status >= 500) {
        setError('Server error. Please try again in a few moments.');
      } else {
        setError('Incorrect username or password.');
      }
    }

  } catch (err) {
    if (err.name === 'AbortError') {
      setError('Connection timed out. Check your network and try again.');
    } else {
      setError('Cannot reach the server. Check your connection.');
    }
    /* تحديث مؤشر الاتصال فوراً */
    updateStatusUI('disconnected', 'Server unreachable');
  } finally {
    setLoading(btn, false);
  }
}

/* ════════════════════════════════════════════════════════════
   ENTER APP
   انتقال سلس إلى لوحة التحكم بعد تسجيل الدخول
════════════════════════════════════════════════════════════ */
function enterApp(userData) {
  /*
   * هنا تُكتب منطق الانتقال إلى لوحة التحكم الرئيسية.
   * في الكود الكامل، يتم إخفاء #login-screen وإظهار #app.
   * نتركه كـ hook جاهز للتكامل مع بقية الكود.
   */
  console.info('[ONLINE] Session established for:', userData?.username || 'user');
  
  /*
   * ← في الكود الأصلي الكامل:
   * document.getElementById('login-screen').style.display = 'none';
   * document.getElementById('app').style.display = 'block';
   * initApp(userData);
   */
  
  /* إيقاف فحص الحالة بعد تسجيل الدخول (لتوفير الموارد) */
  stopStatusPolling();
}

/* ════════════════════════════════════════════════════════════
   SERVER STATUS INDICATOR
   
   المنطق البرمجي الكامل لمؤشر حالة الاتصال:
   
   الحالات:
   • idle         — لم يُفحص بعد (رمادي)
   • checking     — جاري الفحص (برتقالي ووامض)
   • connected    — متصل (أخضر ونابض)
   • disconnected — منقطع (أحمر)
════════════════════════════════════════════════════════════ */
async function checkServerStatus() {
  /* إلغاء أي طلب سابق لم ينتهِ بعد */
  if (_statusAbort) {
    _statusAbort.abort();
  }

  _statusAbort = new AbortController();

  /* عرض حالة "جاري الفحص" */
  updateStatusUI('checking', 'Checking connection…');

  try {
    const res = await fetch(API + '/', {
      method: 'GET',
      signal: AbortSignal.any
        ? AbortSignal.any([
            _statusAbort.signal,
            AbortSignal.timeout(STATUS_TIMEOUT)
          ])
        : _statusAbort.signal,
      cache: 'no-store'  /* منع التخزين المؤقت لضمان نتيجة حقيقية */
    });

    if (res.ok) {
      updateStatusUI('connected', 'Server is online');
    } else {
      updateStatusUI('disconnected', `Server error (${res.status})`);
    }

  } catch (err) {
    if (err.name === 'AbortError') return; /* تم إلغاؤه عمداً — تجاهل */
    updateStatusUI('disconnected', 'Cannot reach server');
  } finally {
    _statusAbort = null;
  }
}

/*
 * updateStatusUI — تحديث الواجهة بحالة الاتصال الجديدة
 * @param {'connected'|'checking'|'disconnected'} state
 * @param {string} message — النص الظاهر للمستخدم
 */
function updateStatusUI(state, message) {
  const dot     = document.getElementById('status-dot');
  const text    = document.getElementById('status-text');
  const retry   = document.getElementById('status-retry');
  const bar     = document.getElementById('status-bar');

  if (!dot || !text) return;

  /* تحديث النقطة */
  dot.className  = 'status-dot ' + state;

  /* تحديث النص */
  text.textContent = message;
  text.className   = 'status-text ' + state;

  /* إظهار زر إعادة المحاولة فقط عند الانقطاع */
  if (retry) {
    retry.style.display = state === 'disconnected' ? 'block' : 'none';
  }

  /* تلوين حافة status-bar عند الاتصال */
  if (bar) {
    if (state === 'connected') {
      bar.style.borderColor = 'rgba(16,185,129,0.25)';
    } else if (state === 'disconnected') {
      bar.style.borderColor = 'rgba(239,68,68,0.25)';
    } else {
      bar.style.borderColor = 'var(--border)';
    }
  }

  /* تحديث aria-label لإمكانية الوصول */
  if (bar) {
    const statusLabels = {
      connected:    'Server is online',
      checking:     'Checking server connection',
      disconnected: 'Server is unreachable'
    };
    bar.setAttribute('aria-label', statusLabels[state] || 'Server status unknown');
  }
}

/*
 * startStatusPolling — بدء الفحص الدوري للاتصال
 * يفحص كل STATUS_INTERVAL ميللي ثانية
 */
function startStatusPolling() {
  /* تجنب تعدد المؤقتات */
  stopStatusPolling();

  _statusTimer = setInterval(() => {
    /* فحص فقط إذا كانت الصفحة ظاهرة (توفير موارد) */
    if (!document.hidden) {
      checkServerStatus();
    }
  }, STATUS_INTERVAL);

  /* إعادة الفحص عند العودة للتبويب */
  document.addEventListener('visibilitychange', _onVisibilityChange);
}

/* توقف الفحص الدوري (عند تسجيل الدخول أو مغادرة الصفحة) */
function stopStatusPolling() {
  if (_statusTimer) {
    clearInterval(_statusTimer);
    _statusTimer = null;
  }
  document.removeEventListener('visibilitychange', _onVisibilityChange);
}

/* Handler لعودة التبويب للمقدمة */
function _onVisibilityChange() {
  if (!document.hidden) {
    checkServerStatus();
  }
}

/* ════════════════════════════════════════════════════════════
   TOGGLE PASSWORD VISIBILITY
════════════════════════════════════════════════════════════ */
function togglePassword() {
  const input    = document.getElementById('inp-pass');
  const eyeOpen  = document.getElementById('eye-open');
  const eyeClosed = document.getElementById('eye-closed');
  const isHidden = input.type === 'password';

  input.type = isHidden ? 'text' : 'password';
  eyeOpen.style.display  = isHidden ? 'none'  : 'block';
  eyeClosed.style.display = isHidden ? 'block' : 'none';

  /* إعادة التركيز على الحقل بعد التبديل */
  input.focus();
}

/* ════════════════════════════════════════════════════════════
   UI HELPERS
════════════════════════════════════════════════════════════ */

/*
 * setError — عرض رسالة خطأ بطريقة آمنة (textContent لا innerHTML)
 * @param {string} msg — الرسالة المراد عرضها
 */
function setError(msg) {
  const el = document.getElementById('login-error');
  if (!el) return;

  /* استخدام textContent دائماً لمنع XSS */
  el.textContent = '';

  /* أيقونة التحذير */
  const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  icon.setAttribute('width', '13');
  icon.setAttribute('height', '13');
  icon.setAttribute('viewBox', '0 0 24 24');
  icon.setAttribute('fill', 'none');
  icon.setAttribute('stroke', 'currentColor');
  icon.setAttribute('stroke-width', '2');
  icon.setAttribute('stroke-linecap', 'round');
  icon.setAttribute('aria-hidden', 'true');
  icon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';

  const span = document.createElement('span');
  span.textContent = msg; /* آمن ضد XSS */

  el.appendChild(icon);
  el.appendChild(span);
  el.classList.add('visible');

  /* تلوين حدود الحقول الفاضية */
  ['inp-user', 'inp-pass'].forEach(id => {
    const inp = document.getElementById(id);
    if (inp && !inp.value) {
      inp.style.borderColor = 'rgba(239,68,68,0.5)';
    }
  });
}

/* clearError — إخفاء رسالة الخطأ ومسح ألوان الحدود */
function clearError() {
  const el = document.getElementById('login-error');
  if (el) {
    el.classList.remove('visible');
    /* لا نمسح textContent فوراً لإتاحة للـ screen readers قراءتها */
    setTimeout(() => { el.textContent = ''; }, 300);
  }

  /* إعادة ألوان الحقول */
  ['inp-user', 'inp-pass'].forEach(id => {
    const inp = document.getElementById(id);
    if (inp) inp.style.borderColor = '';
  });
}

/*
 * setLoading — تبديل زر الدخول بين حالة التحميل والاعتيادية
 * @param {HTMLButtonElement} btn
 * @param {boolean} loading
 */
function setLoading(btn, loading) {
  if (!btn) return;
  btn.disabled = loading;

  if (loading) {
    btn.classList.add('loading');
    btn.setAttribute('aria-label', 'Signing in…');
  } else {
    btn.classList.remove('loading');
    btn.setAttribute('aria-label', 'Sign in');
  }
}

/* ══════════════════════════════════════════════════════════
   CLEANUP — تنظيف عند مغادرة الصفحة
══════════════════════════════════════════════════════════ */
window.addEventListener('beforeunload', () => {
  stopStatusPolling();
  if (_statusAbort) _statusAbort.abort();
});
</script>

</body>
